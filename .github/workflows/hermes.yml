name: Hermes 24-7 WhatsApp Agent

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: hermes-whatsapp-gateway
  cancel-in-progress: true

jobs:
  run-hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CUSTOM_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_BASE_URL: "https://api.groq.com/openai/v1"
      CUSTOM_BASE_URL: "https://api.groq.com/openai/v1"
      WHATSAPP_CLOUD_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_CLOUD_PHONE_NUMBER_ID }}
      WHATSAPP_CLOUD_ACCESS_TOKEN: ${{ secrets.WHATSAPP_CLOUD_ACCESS_TOKEN }}
      WHATSAPP_CLOUD_APP_SECRET: ${{ secrets.WHATSAPP_CLOUD_APP_SECRET }}
      WHATSAPP_CLOUD_VERIFY_TOKEN: ${{ secrets.WHATSAPP_CLOUD_VERIFY_TOKEN }}
      WHATSAPP_CLOUD_ALLOWED_USERS: ${{ secrets.WHATSAPP_CLOUD_ALLOWED_USERS }}
      WHATSAPP_CLOUD_HOME_CHANNEL: ${{ secrets.WHATSAPP_CLOUD_ALLOWED_USERS }}
      WHATSAPP_CLOUD_APP_ID: ${{ secrets.WHATSAPP_CLOUD_APP_ID }}
      WHATSAPP_CLOUD_WEBHOOK_PORT: "8090"
      WHATSAPP_CLOUD_WEBHOOK_PATH: "/whatsapp/webhook"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Hermes Memory & State Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.hermes/memories
            ~/.hermes/platforms
            ~/.hermes/state.db
          key: hermes-state-${{ github.run_id }}
          restore-keys: |
            hermes-state-

      - name: Install & Configure Hermes Agent + Personal Assistant Suite
        run: |
          sudo apt-get update && sudo apt-get install -y libatomic1 ffmpeg jq

          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared

          sudo cp pa.py /usr/local/bin/pa
          sudo chmod +x /usr/local/bin/pa

          rm -rf ~/.hermes/platforms/whatsapp_agent_platform ~/.hermes/plugins/whatsapp-agent-platform ~/.hermes/plugins/whatsapp_agent_platform ~/.hermes/sessions
          mkdir -p ~/.hermes/memories

          cat > ~/.hermes/memories/USER.md << 'EOF'
          # Tayyab Profile & Communication Rules
          - Name: Tayyab Ellahi (21 years old, Karachi, Pakistan, timezone Asia/Karachi UTC+5).
          - Address him as "tum" (never "aap").
          - Language: Always reply in natural Roman Urdu (Urdu in Latin script, how Pakistanis text on WhatsApp). Keep common English words in English (task, gym, deadline, expense, reminder, project). Never use Arabic/Nastaliq script.
          - Tone: Blunt, honest manager — never a cheerleader. No fake praise, no fluff. If a task has rolled over multiple times, call it out plainly.
          - Formatting: Use single asterisk *bold* for WhatsApp bold, never double **bold**.
          EOF

          cat > ~/.hermes/memories/MEMORY.md << 'EOF'
          # Personal Assistant Tracker (`pa` CLI)
          Always use the `terminal` tool to run `pa` commands before claiming any task, expense, record, learning, or reminder change:
          - Tasks:
            - `pa task list` — show pending tasks & rollover counts
            - `pa task add "<title>"` — add a new task for today
            - `pa task done "<id_or_title>"` — mark task done
            - `pa task delete "<id_or_title|all>"` — delete pending task(s)
          - Expenses (PKR):
            - `pa expense add <amount> <category> "<description>"` — categories: food, groceries, transport, bills, shopping, health, family, entertainment, other
            - `pa expense summary` — current month PKR breakdown
          - Custom Records (weight, mood, water, etc.):
            - `pa record add <kind> "<value>"`
            - `pa record list <kind>`
            - `pa record kinds`
          - Spaced-Repetition Learnings (resurfaced at 3, 7, 14, 30 days):
            - `pa learning add "<standalone learning note>"`
            - `pa learning list`
          - Timed Reminders & Namaz:
            - `pa reminder add <HH:MM> "<text>"`
            - `pa reminder list`
            - `pa namaz` — today's Karachi prayer times (Aladhan Method 1) + 15-min advance reminders
            - `pa progress` — completion rate & rollover stats
            - `pa settings` / `pa settings set <key> <value>` — view or change schedule times (`morning_time` 10:00, `night_time` 03:00, `checkin_times` 13:00/16:00/19:00/22:00/01:00, `weekly_time` Sun 21:00, `resurface_time` 18:00)
          EOF

          printf "GROQ_API_KEY=%s\nOPENAI_API_KEY=%s\nCUSTOM_API_KEY=%s\nOPENAI_BASE_URL=https://api.groq.com/openai/v1\nCUSTOM_BASE_URL=https://api.groq.com/openai/v1\nWHATSAPP_CLOUD_PHONE_NUMBER_ID=%s\nWHATSAPP_CLOUD_ACCESS_TOKEN=%s\nWHATSAPP_CLOUD_APP_SECRET=%s\nWHATSAPP_CLOUD_VERIFY_TOKEN=%s\nWHATSAPP_CLOUD_ALLOWED_USERS=%s\nWHATSAPP_CLOUD_HOME_CHANNEL=%s\nWHATSAPP_CLOUD_APP_ID=%s\nWHATSAPP_CLOUD_WEBHOOK_PORT=8090\nWHATSAPP_CLOUD_WEBHOOK_PATH=/whatsapp/webhook\n" \
            "$GROQ_API_KEY" "$GROQ_API_KEY" "$GROQ_API_KEY" "$WHATSAPP_CLOUD_PHONE_NUMBER_ID" "$WHATSAPP_CLOUD_ACCESS_TOKEN" "$WHATSAPP_CLOUD_APP_SECRET" "$WHATSAPP_CLOUD_VERIFY_TOKEN" "$WHATSAPP_CLOUD_ALLOWED_USERS" "$WHATSAPP_CLOUD_HOME_CHANNEL" "$WHATSAPP_CLOUD_APP_ID" > ~/.hermes/.env
          chmod 600 ~/.hermes/.env

          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --non-interactive --skip-browser --skip-computer-use
          export PATH="$HOME/.local/bin:$PATH"

          rm -rf ~/.hermes/skills/* ~/.hermes/hermes-agent/skills/* 2>/dev/null || true
          mkdir -p ~/.hermes/skills

          hermes plugins install groq-provider --yes-deps --enable || true

          python3 - << 'PY'
          import os, json, urllib.request, yaml

          groq_key = os.environ["GROQ_API_KEY"]
          req = urllib.request.Request(
              "https://api.groq.com/openai/v1/models",
              headers={"Authorization": f"Bearer {groq_key}", "User-Agent": "hermes-setup/1.0"},
          )
          with urllib.request.urlopen(req, timeout=15) as resp:
              models_data = json.loads(resp.read().decode())
          available = [m["id"] for m in models_data.get("data", [])]

          preferred = [
              "openai/gpt-oss-120b",
              "qwen/qwen3.8-27b",
              "openai/gpt-oss-20b",
              "llama-3.3-70b-versatile",
              "llama-3.1-8b-instant",
          ]
          chosen_model = next((m for m in preferred if m in available), None)
          if not chosen_model:
              chat_models = [m for m in available if "whisper" not in m and "guard" not in m and "tts" not in m]
              chosen_model = chat_models[0]
          print("Selected Groq model:", chosen_model)

          cfg_path = os.path.expanduser("~/.hermes/config.yaml")
          cfg = {}
          if os.path.exists(cfg_path):
              with open(cfg_path, "r") as f:
                  cfg = yaml.safe_load(f) or {}

          cfg["plugins"] = {"enabled": ["groq-provider"]}

          if not isinstance(cfg.get("providers"), dict):
              cfg["providers"] = {}
          cfg["providers"]["groq"] = {
              "api": "https://api.groq.com/openai/v1",
              "key_env": "GROQ_API_KEY",
          }

          if not isinstance(cfg.get("platforms"), dict):
              cfg["platforms"] = {}
          cfg["platforms"].pop("whatsapp_agent_platform", None)
          cfg["platforms"].pop("whatsapp-agent-platform", None)
          cfg["platforms"]["whatsapp_cloud"] = {"enabled": True}

          if not isinstance(cfg.get("gateway"), dict):
              cfg["gateway"] = {}
          if not isinstance(cfg["gateway"].get("platforms"), dict):
              cfg["gateway"]["platforms"] = {}
          cfg["gateway"]["platforms"].pop("whatsapp_agent_platform", None)
          cfg["gateway"]["platforms"]["whatsapp_cloud"] = {"enabled": True}

          cfg["toolsets"] = ["terminal", "web", "memory", "todo"]
          cfg["platform_toolsets"] = {
              "cli": ["terminal", "web", "memory", "todo"],
              "whatsapp": ["terminal", "web", "memory", "todo"],
              "whatsapp_cloud": ["terminal", "web", "memory", "todo"],
          }

          if not isinstance(cfg.get("agent"), dict):
              cfg["agent"] = {}
          cfg["agent"]["disabled_toolsets"] = [
              "browser",
              "file",
              "code_execution",
              "delegation",
              "skills",
              "image_gen",
              "vision",
              "tts",
              "cronjob",
              "session_search",
              "clarify",
              "homeassistant",
              "rl",
              "moa",
          ]

          cfg["model"] = {
              "provider": "custom:groq",
              "default": chosen_model,
              "base_url": "https://api.groq.com/openai/v1",
          }

          if not isinstance(cfg.get("compression"), dict):
              cfg["compression"] = {}
          cfg["compression"]["enabled"] = True
          cfg["compression"]["threshold_tokens"] = 4500

          if not isinstance(cfg.get("stt"), dict):
              cfg["stt"] = {}
          cfg["stt"]["provider"] = "groq"
          cfg["stt"]["echo_transcripts"] = False

          with open(cfg_path, "w") as f:
              yaml.safe_dump(cfg, f, sort_keys=False)
          PY

          pa namaz || true
          pkill -f "hermes.*gateway" 2>/dev/null || true

      - name: Run Hermes WhatsApp Cloud Gateway + PA Scheduler (5h 30m cycle)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pkill -f "hermes.*gateway" 2>/dev/null || true
          sleep 1

          pa daemon > /tmp/pa-daemon.log 2>&1 &
          PA_PID=$!

          cloudflared tunnel --url http://localhost:8090 --no-autoupdate > /tmp/cloudflared.log 2>&1 &
          CF_PID=$!

          TUNNEL_URL=""
          for i in $(seq 1 30); do
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "ERROR: Failed to obtain Cloudflare tunnel URL"
            cat /tmp/cloudflared.log
            exit 1
          fi
          echo "Cloudflare Tunnel ready: $TUNNEL_URL"

          (
            echo "Waiting for Hermes webhook listener on :8090..."
            for i in $(seq 1 60); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8090/whatsapp/webhook?hub.mode=subscribe&hub.verify_token=${WHATSAPP_CLOUD_VERIFY_TOKEN}&hub.challenge=ready" || true)
              if [ "$CODE" = "200" ]; then
                echo "Hermes webhook listener is UP (HTTP 200)!"
                break
              fi
              sleep 2
            done

            echo "Waiting 6s for Cloudflare DNS propagation..."
            sleep 6

            for attempt in $(seq 1 6); do
              echo "Registering Meta Webhook callback URL (attempt $attempt) -> ${TUNNEL_URL}/whatsapp/webhook"
              SUB_RESP=$(curl -sS -X POST "https://graph.facebook.com/v23.0/${WHATSAPP_CLOUD_APP_ID}/subscriptions" \
                -d "object=whatsapp_business_account" \
                -d "callback_url=${TUNNEL_URL}/whatsapp/webhook" \
                -d "verify_token=${WHATSAPP_CLOUD_VERIFY_TOKEN}" \
                -d "fields=messages" \
                -d "access_token=${WHATSAPP_CLOUD_APP_ID}|${WHATSAPP_CLOUD_APP_SECRET}" || true)
              echo "Meta subscription response: $SUB_RESP"
              if echo "$SUB_RESP" | grep -q '"success":true'; then
                echo "Meta Webhook registered successfully!"
                break
              fi
              sleep 5
            done
          ) &

          timeout 325m hermes gateway || true
          kill $CF_PID $PA_PID 2>/dev/null || true

      - name: Save Hermes Memory & State Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.hermes/memories
            ~/.hermes/platforms
            ~/.hermes/state.db
          key: hermes-state-${{ github.run_id }}