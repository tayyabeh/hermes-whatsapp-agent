name: Hermes 24-7 WhatsApp Agent

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: hermes-whatsapp-gateway
  cancel-in-progress: true

jobs:
  run-hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      WHATSAPP_AGENT_PLATFORM_API_KEY: ${{ secrets.WHATSAPP_AGENT_PLATFORM_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Hermes Memory & State Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.hermes/memories
            ~/.hermes/skills
            ~/.hermes/sessions
            ~/.hermes/platforms
            ~/.hermes/state.db
          key: hermes-state-${{ github.run_id }}
          restore-keys: |
            hermes-state-

      - name: Install & Configure Hermes Agent + WhatsApp Plugin
        run: |
          sudo apt-get update && sudo apt-get install -y libatomic1 ffmpeg
          mkdir -p ~/.hermes
          printf "WHATSAPP_AGENT_PLATFORM_API_KEY=%s\nGROQ_API_KEY=%s\n" \
            "$WHATSAPP_AGENT_PLATFORM_API_KEY" "$GROQ_API_KEY" > ~/.hermes/.env
          chmod 600 ~/.hermes/.env
          echo "Checking secret lengths: WA=${#WHATSAPP_AGENT_PLATFORM_API_KEY}, GROQ=${#GROQ_API_KEY}"
          if [ -z "$WHATSAPP_AGENT_PLATFORM_API_KEY" ]; then
            echo "ERROR: WHATSAPP_AGENT_PLATFORM_API_KEY secret is EMPTY!"
            exit 1
          fi
          if [ -z "$GROQ_API_KEY" ]; then
            echo "ERROR: GROQ_API_KEY secret is EMPTY in GitHub Settings -> Secrets and variables -> Actions!"
            exit 1
          fi

          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --non-interactive --skip-browser --skip-computer-use
          export PATH="$HOME/.local/bin:$PATH"

          hermes plugins install whatsapp-agent-platform --yes-deps --enable || true
          hermes plugins enable whatsapp-agent-platform || true

          python3 - << 'PY'
          import os, yaml
          cfg_path = os.path.expanduser("~/.hermes/config.yaml")
          cfg = {}
          if os.path.exists(cfg_path):
              with open(cfg_path, "r") as f:
                  cfg = yaml.safe_load(f) or {}
          cfg.setdefault("plugins", {})
          enabled = cfg["plugins"].get("enabled") or []
          for name in ["whatsapp-agent-platform", "whatsapp_agent_platform"]:
              if name not in enabled:
                  enabled.append(name)
          cfg["plugins"]["enabled"] = enabled
          cfg.setdefault("platforms", {})
          cfg["platforms"].setdefault("whatsapp_agent_platform", {})["enabled"] = True
          cfg.setdefault("model", {})
          cfg["model"]["provider"] = "groq"
          cfg["model"]["default"] = "llama-3.3-70b-versatile"
          cfg.setdefault("display", {}).setdefault("platforms", {}).setdefault("whatsapp_agent_platform", {}).update({
              "tool_progress": "off",
              "interim_assistant_messages": False,
              "long_running_notifications": False,
              "busy_ack_detail": False,
          })
          cfg.setdefault("stt", {})["echo_transcripts"] = False
          with open(cfg_path, "w") as f:
              yaml.safe_dump(cfg, f, sort_keys=False)
          print("Updated config.yaml successfully:")
          with open(cfg_path, "r") as f:
              print(f.read())
          PY

          hermes plugins list

      - name: Run Hermes WhatsApp Gateway (5h 30m cycle)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          timeout 330m hermes gateway || true

      - name: Save Hermes Memory & State Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.hermes/memories
            ~/.hermes/skills
            ~/.hermes/sessions
            ~/.hermes/platforms
            ~/.hermes/state.db
          key: hermes-state-${{ github.run_id }}